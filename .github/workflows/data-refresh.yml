# The public site updates through /api/live, independently of this workflow.
# This scheduled job retains diagnostics as an artifact; it needs no PR/write
# permission and never blocks fresh data on a human merge or account policy.
name: Data refresh

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail after saving diagnostics if upstream is unavailable or a shipped free route is gone"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  check:
    name: Check public sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Query public sources and save evidence
        id: check
        run: node tools/refresh-data.mjs
      - name: Validate data and the complete app
        run: |
          node tests/run-tests.mjs
          node tests/smoke-dom.mjs
          node tests/api-tests.mjs
          node tests/live-data-tests.mjs
      - name: Retain diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-refresh-${{ github.run_id }}
          path: |
            data/refresh-report.json
            data/refresh-report.md
          retention-days: 14
          if-no-files-found: warn
      - name: Enforce optional strict diagnostics
        if: inputs.strict == true
        env:
          SOURCE_ERROR: ${{ steps.check.outputs.source_error }}
          DEAD_ROUTES: ${{ steps.check.outputs.dead_routes }}
        run: node -e "if (process.env.SOURCE_ERROR === '1' || Number(process.env.DEAD_ROUTES) > 0) process.exit(1)"
